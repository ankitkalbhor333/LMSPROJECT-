services:
  # Backend API Service
  - type: web
    name: lmsproject1
    runtime: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        scope: project
      - key: JWT_SECRET
        scope: project
      - key: EMAIL_USER
        scope: project
      - key: EMAIL_PASS
        scope: project
      - key: EMAIL_PASSWORD
        scope: project
      - key: SMTP_USER
        scope: project
      - key: SMTP_PASS
        scope: project
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: FRONTEND_URL
        value: https://brsaina.in
      - key: BACKEND_URL
        value: https://lmsproject1-cuzs.onrender.com
      - key: CORS_ORIGIN
        value: https://brsaina.in,https://lmsprojectfrontend.onrender.com,https://lmsproject1-cuzs.onrender.com,http://localhost:5173

  # Frontend React App
  - type: static_site
    name: lmsprojectfrontend
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://lmsproject1-cuzs.onrender.com
    routes:
      - path: /*
        destination: /index.html
